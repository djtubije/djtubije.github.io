<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Desmond John Tubije</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Desmond John Tubije</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="academic-work.html">Academic Work</a></li>
                    <li><a href="internship.html">Internship</a></li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="reflection.html">Reflection</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="resume-view" class="content-section">
            <div class="container" style="text-align: center;">
                <h2>My Professional Resume</h2>
                <p>Click the button below to download the full PDF version of my resume.</p>
                
                <a href="Desmond_Tubije_Resume.pdf" download class="cta-button" style="margin: 20px 0;">
                    ⬇️ Download Resume (PDF)
                </a>

                <div class="pdf-container">
                    <iframe src="Desmond_Tubije_Resume.pdf" frameborder="0"></iframe>
                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading the footer:', error);
            });
    </script>
</body>
</html>
