<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Desmond John Tubije</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-placeholder"></div>

    <main>
        <section id="resume-view" class="content-section">
            <div class="container" style="text-align: center;">
                <h2>My Professional Resume</h2>
                <p>Click the button below to download the full PDF version of my resume.</p>
                
                <a href="Desmond_Tubije_Resume.pdf" download class="cta-button" style="margin: 20px 0;">
                    ⬇️ Download Resume (PDF)
                </a>

                <div class="pdf-container">
                    <iframe src="Desmond_Tubije_Resume.pdf" frameborder="0"></iframe>
                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

<script>
        fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-placeholder').innerHTML = data;

            // 2. Highlight the current page in the navigation
            const currentPath = window.location.pathname.split("/").pop() || 'index.html';
            const navLinks = document.querySelectorAll('nav ul li a');

            navLinks.forEach(link => {
                // Check if the link's href matches the current file name
                if (link.getAttribute('href') === currentPath) {
                    link.style.color = '#3498db'; // Sets your primary blue color
                    link.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                }
            });
        });
        fetch('footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading the footer:', error);
            });
    </script>
</body>
</html>
